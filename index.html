<script>
  function toggleOtherStaff() {
    const recordedBy = document.getElementById('recordedBy');
    const otherStaffContainer = document.getElementById('otherStaffContainer');
    const otherStaffName = document.getElementById('otherStaffName');

    if (recordedBy.value === 'อื่นๆ') {
      // แสดงช่องกรอกชื่อ
      otherStaffContainer.classList.remove('hidden');

      // บังคับให้กรอกชื่อ
      otherStaffName.required = true;
    } else {
      // ซ่อนช่องกรอกชื่อ
      otherStaffContainer.classList.add('hidden');

      // ไม่บังคับกรอก
      otherStaffName.required = false;

      // ล้างค่าที่เคยกรอกไว้
      otherStaffName.value = '';
    }
  }
</script>

        "Intestinal Clamp", "Right angle clamp", "Long forceps", "Long fine forceps",
        "Babcock tissue forceps", "Sponge holding forceps", "ถ้วยน้ำยา"
    ];

    // =========================================================================
    // 2. ระบบค้นหาและเลือกชื่อเซ็ต (Searchable Dropdown)
    // =========================================================================
    const itemSearchInput = document.getElementById('itemSearchInput');
    const itemListDropdown = document.getElementById('itemListDropdown');

    function renderItemList(filterText = '') {
      itemListDropdown.innerHTML = '';
      const filter = filterText.toLowerCase().trim();
      const filteredItems = ITEM_LIST.filter(item => item.toLowerCase().includes(filter));

      if (filteredItems.length === 0) {
        const li = document.createElement('li');
        li.className = 'px-4 py-2.5 text-sm text-slate-400 italic';
        li.textContent = 'ไม่พบในรายการมาตรฐาน (จะใช้ชื่อที่พิมพ์)';
        itemListDropdown.appendChild(li);
      } else {
        filteredItems.forEach(item => {
          const li = document.createElement('li');
          li.className = 'px-4 py-2.5 text-sm hover:bg-teal-50 hover:text-teal-800 cursor-pointer transition';
          li.textContent = item;
          li.addEventListener('mousedown', () => {
            itemSearchInput.value = item;
            itemListDropdown.classList.add('hidden');
          });
          itemListDropdown.appendChild(li);
        });
      }
    }

    itemSearchInput.addEventListener('focus', () => {
      renderItemList(itemSearchInput.value);
      itemListDropdown.classList.remove('hidden');
    });

    itemSearchInput.addEventListener('input', (e) => {
      renderItemList(e.target.value);
      itemListDropdown.classList.remove('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!itemSearchInput.contains(e.target) && !itemListDropdown.contains(e.target)) {
        itemListDropdown.classList.add('hidden');
      }
    });

    function resetFormCustom() {
      itemListDropdown.classList.add('hidden');
      setTimeout(() => {
        document.querySelector('input[name="sterileType"][value="SA (ไอน้ำ)"]').checked = true;
      }, 50);
    }

    // =========================================================================
    // 3. ฟังก์ชันส่งข้อมูลเข้า Google Sheets และแจ้งเตือน LINE
    // =========================================================================
    const form = document.getElementById('reSterileForm');
    const alertBox = document.getElementById('statusAlert');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnSubmit.disabled = true;
      btnText.innerText = "กำลังบันทึก...";

      const selectedType = document.querySelector('input[name="sterileType"]:checked').value;

      const payload = {
        itemName: itemSearchInput.value.trim(),
        department: document.getElementById('department').value,
        reason: document.getElementById('reason').value,
        sterileType: selectedType,
        recordedBy: document.getElementById('recordedBy').value,
        notes: document.getElementById('notes').value.trim()
      };

      try {
        // ⚠️ จุดแก้ไขสำคัญ: ปรับ Content-Type เป็น text/plain;charset=utf-8 สำหรับ Apps Script doPost
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 
            'Content-Type': 'text/plain;charset=utf-8' 
          },
          body: JSON.stringify(payload)
        });

        alertBox.className = 'mt-4 p-4 rounded-lg text-sm bg-emerald-50 text-emerald-800 border border-emerald-200 block';
        alertBox.innerHTML = `✅ <strong>บันทึกสำเร็จ!</strong>: ${payload.itemName} [${payload.sterileType}] โดย ${payload.recordedBy} บันทึกลงชีตและแจ้งเตือน LINE เรียบร้อย`;
        
        form.reset();
        resetFormCustom();
        itemSearchInput.focus();

      } catch (error) {
        alertBox.className = 'mt-4 p-4 rounded-lg text-sm bg-rose-50 text-rose-800 border border-rose-200 block';
        alertBox.innerHTML = `❌ <strong>เกิดข้อผิดพลาด:</strong> ${error.message}`;
      } finally {
        btnSubmit.disabled = false;
        btnText.innerText = "บันทึกข้อมูล";
      }
    });

    // =========================================================================
    // 4. ฟังก์ชันดาวน์โหลดไฟล์
    // =========================================================================
    function downloadSheet(format) {
      let exportUrl = "";
      if (format === 'xlsx') {
        exportUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=xlsx`;
      } else if (format === 'csv') {
        exportUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv`;
      } else if (format === 'pdf') {
        exportUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=pdf&portrait=false&size=a4&gridlines=true&fitw=true`;
      }
      window.open(exportUrl, '_blank');
    }
  </script>
</body>
</html>
